<script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbybUYvBxmU5UJFqpgf8NOAa_jNxCicrszt6x2LER8J0SvcHG3XACMLQ6Tpu8bbaSxx_/exec'; // Reemplazar con tu URL de Apps Script

    let cotizacionesCache = [];
    let clientesCache = [];
    let vehiculosCache = [];
    let usuariosCache = [];
    let bitacoraCache = [];
    let fotoBase64Actual = null;
    let fotoUrlEnEdicion = null;
    let sesionActual = null;
    const ESTADOS_OCUPAN_VEHICULO = ['Programado', 'En Ejecución'];
    const CLAVE_SESION = 'mej_sesion';

    // ---------- SANEAMIENTO DE FECHAS Y HORAS ----------
    function formatearFecha(valor) {
        if (!valor) return '';
        const str = String(valor).trim();
        if (/^\d{4}-\d{2}-\d{2}/.test(str)) return str.substring(0, 10);
        const d = new Date(str);
        if (!isNaN(d.getTime())) {
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }
        return str;
    }

    function formatearHora(valor) {
        if (!valor) return '';
        const str = String(valor).trim();
        if (/^\d{2}:\d{2}/.test(str)) return str.substring(0, 5);
        const d = new Date(str);
        if (!isNaN(d.getTime())) {
            const hh = String(d.getUTCHours()).padStart(2, '0');
            const mi = String(d.getUTCMinutes()).padStart(2, '0');
            return `${hh}:${mi}`;
        }
        return str;
    }

    function sanearProgramacionCotizacion(cot) {
        return {
            ...cot,
            fecha_programada: formatearFecha(cot.fecha_programada),
            hora_inicio: formatearHora(cot.hora_inicio),
            hora_fin: formatearHora(cot.hora_fin)
        };
    }

    document.addEventListener("DOMContentLoaded", () => {
        restaurarSesion();
    });

    // ---------- AUTENTICACIÓN Y SESIÓN ----------
    function restaurarSesion() {
        try {
            const guardada = localStorage.getItem(CLAVE_SESION);
            if (guardada) {
                sesionActual = JSON.parse(guardada);
                mostrarApp();
                return;
            }
        } catch (e) {}
        document.getElementById('loginOverlay').classList.remove('hidden');
        document.getElementById('appShell').classList.add('hidden');
    }

    function mostrarApp() {
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('appShell').classList.remove('hidden');
        document.getElementById('sesionNombre').textContent = sesionActual.nombre || sesionActual.id_usuario || '';
        document.getElementById('sesionRol').textContent = sesionActual.rol || '';
        aplicarPermisosPorRol(sesionActual.rol);
        cargarDatos();
    }

    async function iniciarSesion(event) {
        event.preventDefault();
        const usuario = document.getElementById('loginUsuario').value.trim();
        const password = document.getElementById('loginPassword').value;
        const btn = document.getElementById('btnLogin');
        const btnTexto = document.getElementById('btnLoginTexto');
        const btnSpinner = document.getElementById('btnLoginSpinner');
        const errorBox = document.getElementById('loginError');
        errorBox.classList.add('hidden');

        btn.disabled = true;
        btnTexto.textContent = 'Verificando...';
        btnSpinner.classList.remove('hidden');

        try {
            const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ tipo: 'login', usuario, password }) });
            const resp = await res.json();
            if (resp.result === 'error') throw new Error(resp.message || 'Error de credenciales');

            sesionActual = resp.usuario;
            localStorage.setItem(CLAVE_SESION, JSON.stringify(sesionActual));
            mostrarApp();
        } catch (err) {
            errorBox.textContent = err.message;
            errorBox.classList.remove('hidden');
        } finally {
            btn.disabled = false;
            btnTexto.textContent = 'Ingresar';
            btnSpinner.classList.add('hidden');
        }
    }

    function cerrarSesion() {
        localStorage.removeItem(CLAVE_SESION);
        sesionActual = null;
        location.reload();
    }

    // ---------- PERMISOS POR ROL Y NAVEGACIÓN ESTRICTA ----------
    function aplicarPermisosPorRol(rol) {
        const rolNorm = String(rol || '').toUpperCase();
        const esOperador = (rolNorm === 'OPERADOR');

        // Ocultar del menú de navegación superior si es Operador
        ['navLobby', 'navClientes', 'navCotizaciones', 'navVehiculos', 'navFacturacion'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.style.display = esOperador ? 'none' : 'inline-flex';
        });

        const navBit = document.getElementById('navBitacora');
        if (navBit) navBit.style.display = 'inline-flex';

        const navProg = document.getElementById('navProgramacion');
        if (navProg) navProg.style.display = esOperador ? 'inline-flex' : 'inline-flex';

        // Ocultar tarjetas directas del Lobby que no corresponden
        const tarjetasLobby = document.querySelectorAll('#secLobby .grid > div');
        tarjetasLobby.forEach((tarjeta, index) => {
            if (esOperador && [0, 1, 3, 4].includes(index)) {
                tarjeta.style.display = 'none';
            } else {
                tarjeta.style.display = 'block';
            }
        });

        const btnFlotante = document.getElementById('btnRegistrarEtapaFlotante');
        if (btnFlotante) btnFlotante.classList.toggle('hidden', !esOperador);

        switchTab(esOperador ? 'bitacora' : 'lobby');
    }

    function switchTab(tab) {
        const esOperador = sesionActual && String(sesionActual.rol || '').toUpperCase() === 'OPERADOR';

        // Redirigir a bitácora si un operador intenta navegar a módulos restringidos
        if (esOperador && ['lobby', 'clientes', 'cotizaciones', 'vehiculos', 'facturacion'].includes(tab)) {
            tab = 'bitacora';
        }

        ['Lobby', 'Clientes', 'Cotizaciones', 'Programacion', 'Vehiculos', 'Facturacion', 'Bitacora'].forEach(t => {
            const sec = document.getElementById('sec' + t);
            if (sec) sec.classList.add('hidden');
            let nav = document.getElementById('nav' + t);
            if (nav) nav.className = "px-3 py-2 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100";
        });

        const secActual = document.getElementById('sec' + tab.charAt(0).toUpperCase() + tab.slice(1));
        if (secActual) secActual.classList.remove('hidden');

        let activeNav = document.getElementById('nav' + tab.charAt(0).toUpperCase() + tab.slice(1));
        if (activeNav) activeNav.className = "px-3 py-2 text-sm font-medium rounded-lg bg-blue-50 text-blue-700";

        const btnVolver = document.getElementById('btnVolverLobby');
        if (btnVolver) {
            if (tab === 'lobby' || esOperador) btnVolver.classList.add('hidden');
            else btnVolver.classList.remove('hidden');
        }
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    // ---------- TOAST DE NOTIFICACIONES ----------
    function mostrarToast(msg, tipo) {
        const t = document.getElementById('toast');
        const colores = { success: 'bg-emerald-600', error: 'bg-red-600', warning: 'bg-amber-600' };
        const iconos = { success: 'fa-circle-check', error: 'fa-triangle-exclamation', warning: 'fa-triangle-exclamation' };
        t.className = `toast fixed bottom-6 left-6 z-50 ${colores[tipo] || 'bg-slate-800'} text-white px-4 py-3 rounded-lg shadow-lg text-sm flex items-center gap-2 max-w-md`;
        t.innerHTML = `<i class="fa-solid ${iconos[tipo] || 'fa-circle-info'}"></i> ${msg}`;
        t.classList.remove('hidden');
        clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(() => t.classList.add('hidden'), tipo === 'warning' ? 7000 : 3500);
    }

    // ---------- CARGA GENERAL DE DATOS ----------
    function cargarDatos() {
        // Cargar Usuarios
        fetch(`${WEB_APP_URL}?action=usuarios`).then(res => res.json()).then(data => {
            usuariosCache = data;
            let selectPersonal = document.getElementById('cotPersonal');
            if (selectPersonal) {
                const seleccionPrevia = Array.from(selectPersonal.selectedOptions).map(o => o.value);
                selectPersonal.innerHTML = '';
                data.filter(u => String(u.estado || '').toLowerCase() === 'activo').forEach(u => {
                    const opt = document.createElement('option');
                    opt.value = u.nombre;
                    opt.textContent = `${u.nombre} (${u.rol || ''})`;
                    if (seleccionPrevia.includes(u.nombre)) opt.selected = true;
                    selectPersonal.appendChild(opt);
                });
            }
        });

        // Cargar Clientes
        fetch(`${WEB_APP_URL}?action=clientes`).then(res => res.json()).then(data => {
            clientesCache = data;
            let tbody = document.getElementById('tableClientes');
            let selectCotCli = document.getElementById('cotCliente');
            if (tbody) tbody.innerHTML = "";
            if (selectCotCli) selectCotCli.innerHTML = '<option value="">Selecciona un cliente...</option>';
            data.forEach(c => {
                const razon = c.razon_social || '(Sin razón social)';
                if (tbody) {
                    tbody.innerHTML += `<tr class="hover:bg-slate-50">
                        <td class="p-3 pl-4 font-mono font-bold text-blue-600">${c.id_cliente || ''}</td>
                        <td class="p-3 font-semibold">${razon}</td>
                        <td class="p-3">${c.ruc || ''}</td>
                        <td class="p-3">${c.contacto || ''}</td>
                        <td class="p-3 text-slate-500">${c.correo || ''}</td>
                        <td class="p-3"><button onclick="editarCliente('${c.id_cliente}')" class="text-blue-600 hover:underline text-xs font-medium"><i class="fa-solid fa-pen mr-1"></i>Editar</button></td>
                    </tr>`;
                }
                if (c.razon_social && selectCotCli) {
                    selectCotCli.innerHTML += `<option value="${razon}">${razon} — RUC ${c.ruc || 's/n'}</option>`;
                }
            });
        });

        // Cargar Cotizaciones
        fetch(`${WEB_APP_URL}?action=cotizaciones`).then(res => res.json()).then(data => {
            cotizacionesCache = data.map(sanearProgramacionCotizacion);
            let tbody = document.getElementById('tableCotizaciones');
            let selectFacCot = document.getElementById('facCot');
            if (tbody) tbody.innerHTML = "";
            if (selectFacCot) selectFacCot.innerHTML = '<option value="">Selecciona una cotización...</option>';
            
            const coloresEstado = {
                'En Cotización': 'bg-amber-50 text-amber-700 border border-amber-200',
                'Programado': 'bg-blue-50 text-blue-700 border border-blue-100',
                'En Ejecución': 'bg-orange-50 text-orange-700 border border-orange-100',
                'Completado': 'bg-emerald-50 text-emerald-700 border border-emerald-100',
                'Rechazada': 'bg-red-50 text-red-700 border border-red-100'
            };

            cotizacionesCache.forEach(cot => {
                const facturado = (cot.facturado === 'Sí' || cot.facturado === 'Si');
                const badgeFacturado = facturado
                    ? `<span class="bg-emerald-50 text-emerald-700 text-xs px-2 py-1 rounded-full font-medium">Sí</span>`
                    : `<span class="bg-slate-100 text-slate-500 text-xs px-2 py-1 rounded-full font-medium">No</span>`;
                const horario = (cot.hora_inicio && cot.hora_fin) ? `${cot.hora_inicio} - ${cot.hora_fin}` : (cot.hora_inicio || cot.hora_fin || '-');
                const claseEstado = coloresEstado[cot.estado] || 'bg-purple-50 text-purple-700 border border-purple-100';
                
                if (tbody) {
                    tbody.innerHTML += `<tr class="hover:bg-slate-50">
                        <td class="p-3 pl-4 font-mono font-bold text-purple-600">${cot.id_cotizacion || ''}</td>
                        <td class="p-3 font-semibold">${cot.cliente || ''}</td>
                        <td class="p-3">${cot.descripcion || ''}</td>
                        <td class="p-3">${cot.peso_aprox || ''}</td>
                        <td class="p-3">${cot.tipo_material || ''}</td>
                        <td class="p-3">${cot.tipo_pago || ''}</td>
                        <td class="p-3 font-mono">S/. ${cot.monto || '0.00'}</td>
                        <td class="p-3">${cot.fecha_programada || '-'}</td>
                        <td class="p-3 text-emerald-700 font-mono">${cot.vehiculo_asignado || '-'}</td>
                        <td class="p-3">${horario}</td>
                        <td class="p-3 text-xs text-slate-600">${cot.conductor_asignado || '-'}</td>
                        <td class="p-3"><span class="${claseEstado} text-xs px-2 py-1 rounded-full font-medium">${cot.estado || ''}</span></td>
                        <td class="p-3">${badgeFacturado}</td>
                        <td class="p-3"><button onclick="editarCotizacion('${cot.id_cotizacion}')" class="text-purple-600 hover:underline text-xs font-medium"><i class="fa-solid fa-pen mr-1"></i>Editar</button></td>
                    </tr>`;
                }

                if ((cot.estado === 'Completado' || cot.estado === 'Programado') && selectFacCot) {
                    selectFacCot.innerHTML += `<option value="${cot.id_cotizacion}">${cot.id_cotizacion} — ${cot.cliente} (${cot.estado})</option>`;
                }
            });

            renderizarCalendario();
        });

        // Cargar Vehículos
        fetch(`${WEB_APP_URL}?action=vehiculos`).then(res => res.json()).then(data => {
            vehiculosCache = data;
            let tbody = document.getElementById('tableVehiculos');
            let selectCotVeh = document.getElementById('cotVehiculoAsignado');
            if (tbody) tbody.innerHTML = "";
            if (selectCotVeh) selectCotVeh.innerHTML = '<option value="">Sin asignar aún</option>';
            data.forEach(v => {
                const estado = v.estado || 'Disponible';
                if (tbody) {
                    tbody.innerHTML += `<tr class="hover:bg-slate-50">
                        <td class="p-3 pl-4 font-semibold">${v.vehiculo || ''}</td>
                        <td class="p-3 text-blue-600 font-mono">${v.unidad || ''}</td>
                        <td class="p-3">${v.m3 || '-'}</td>
                        <td class="p-3">${v.tn_carga || ''}</td>
                        <td class="p-3"><span class="bg-emerald-50 text-emerald-700 text-xs px-2 py-1 rounded-full">${estado}</span></td>
                    </tr>`;
                }
                if (v.unidad && selectCotVeh) {
                    selectCotVeh.innerHTML += `<option value="${v.unidad}">${v.vehiculo || ''} — ${v.unidad} (${estado})</option>`;
                }
            });
        });

        // Cargar Facturación
        fetch(`${WEB_APP_URL}?action=facturacion`).then(res => res.json()).then(data => {
            let tbody = document.getElementById('tableFacturacion');
            if (tbody) {
                tbody.innerHTML = "";
                data.forEach(f => {
                    tbody.innerHTML += `<tr class="hover:bg-slate-50">
                        <td class="p-3 pl-4 font-medium text-amber-600 font-mono">${f.id_facturacion || ''}</td>
                        <td class="p-3 text-purple-600">${f.cotizacion || ''}</td>
                        <td class="p-3 font-semibold">${f.cliente || ''}</td>
                        <td class="p-3 font-mono">S/. ${f.monto || '0.00'}</td>
                        <td class="p-3">${formatearFecha(f.fecha_pago) || '-'}</td>
                        <td class="p-3"><span class="bg-amber-50 text-amber-700 text-xs px-2 py-1 rounded-full font-medium">${f.estado || ''}</span></td>
                    </tr>`;
                });
            }
        });

        // Cargar Bitácora
        fetch(`${WEB_APP_URL}?action=bitacora`).then(res => res.json()).then(data => {
            bitacoraCache = data;
            let tbody = document.getElementById('tableBitacora');
            if (!tbody) return;
            tbody.innerHTML = "";
            const ordenados = data.slice().sort((a, b) => String(b.fecha_hora || '').localeCompare(String(a.fecha_hora || '')));
            ordenados.forEach(b => {
                const usuario = usuariosCache.find(u => u.id_usuario === b.id_usuario);
                tbody.innerHTML += `<tr class="hover:bg-slate-50">
                    <td class="p-3 pl-4 font-mono font-bold text-purple-600">${b.id_cotizacion || ''}</td>
                    <td class="p-3 font-mono">${b.placa_vehiculo || ''}</td>
                    <td class="p-3"><span class="bg-blue-50 text-blue-700 text-xs px-2 py-1 rounded-full font-medium">${b.etapa || ''}</span></td>
                    <td class="p-3 text-slate-500">${b.fecha_hora || ''}</td>
                    <td class="p-3">${b.km_lectura || ''}</td>
                    <td class="p-3">${usuario ? usuario.nombre : (b.id_usuario || '')}</td>
                    <td class="p-3 text-slate-500">${b.observaciones || ''}</td>
                </tr>`;
            });
        });
    }

    // ---------- MODALES DE EDICIÓN Y CREACIÓN ----------
    function abrirModalCliente() {
        document.getElementById('cliModo').value = 'crear';
        document.getElementById('modalClienteTitulo').textContent = 'Registrar Nuevo Cliente';
        document.getElementById('btnGuardarClienteTexto').textContent = 'Guardar Cliente';
        document.getElementById('cliId').value = "Generando...";
        document.getElementById('cliRazon').value = '';
        document.getElementById('cliRuc').value = '';
        document.getElementById('cliContacto').value = '';
        document.getElementById('cliCorreo').value = '';
        openModal('modalCliente');
        fetch(`${WEB_APP_URL}?action=siguiente_id`)
            .then(res => res.json())
            .then(data => { document.getElementById('cliId').value = data.nextId; })
            .catch(() => { document.getElementById('cliId').value = "CLI-001"; });
    }

    function editarCliente(id) {
        const c = clientesCache.find(x => x.id_cliente === id);
        if (!c) return;
        document.getElementById('cliModo').value = 'editar';
        document.getElementById('modalClienteTitulo').textContent = 'Editar Cliente';
        document.getElementById('btnGuardarClienteTexto').textContent = 'Actualizar Cliente';
        document.getElementById('cliId').value = c.id_cliente || '';
        document.getElementById('cliRazon').value = c.razon_social || '';
        document.getElementById('cliRuc').value = c.ruc || '';
        document.getElementById('cliContacto').value = c.contacto || '';
        document.getElementById('cliCorreo').value = c.correo || '';
        openModal('modalCliente');
    }

    function abrirModalCotizacion() {
        document.getElementById('cotModo').value = 'crear';
        document.getElementById('modalCotizacionTitulo').textContent = 'Nueva Cotización';
        document.getElementById('btnGuardarCotizacionTexto').textContent = 'Guardar Cotización';
        document.getElementById('cotId').value = "Generando...";
        document.getElementById('cotCliente').value = '';
        document.getElementById('cotDesc').value = '';
        document.getElementById('cotPeso').value = '';
        document.getElementById('cotTipoMaterial').value = '';
        document.getElementById('cotUbicacion').value = '';
        document.getElementById('cotTipoPago').value = '';
        document.getElementById('cotMonto').value = '';
        document.getElementById('cotEstado').value = 'En Cotización';
        document.getElementById('cotFechaProgramada').value = '';
        document.getElementById('cotVehiculoAsignado').value = '';
        document.getElementById('cotHoraInicio').value = '';
        document.getElementById('cotHoraFin').value = '';
        Array.from(document.getElementById('cotPersonal').options).forEach(o => o.selected = false);
        quitarFoto();
        openModal('modalCotizacion');
        fetch(`${WEB_APP_URL}?action=siguiente_id_cotizacion`)
            .then(res => res.json())
            .then(data => { document.getElementById('cotId').value = data.nextId; })
            .catch(() => { document.getElementById('cotId').value = ""; });
    }

    function editarCotizacion(id) {
        const cot = cotizacionesCache.find(c => c.id_cotizacion === id);
        if (!cot) return;

        document.getElementById('cotModo').value = 'editar';
        document.getElementById('modalCotizacionTitulo').textContent = 'Editar Cotización ' + id;
        document.getElementById('btnGuardarCotizacionTexto').textContent = 'Actualizar Cotización';
        document.getElementById('cotId').value = cot.id_cotizacion || '';
        document.getElementById('cotCliente').value = cot.cliente || '';
        document.getElementById('cotDesc').value = cot.descripcion || '';
        document.getElementById('cotPeso').value = cot.peso_aprox || '';
        document.getElementById('cotTipoMaterial').value = cot.tipo_material || '';
        document.getElementById('cotUbicacion').value = cot.ubicacion || '';
        document.getElementById('cotTipoPago').value = cot.tipo_pago || '';
        document.getElementById('cotMonto').value = cot.monto || '';
        document.getElementById('cotEstado').value = cot.estado || 'En Cotización';
        document.getElementById('cotFechaProgramada').value = cot.fecha_programada || '';
        document.getElementById('cotVehiculoAsignado').value = cot.vehiculo_asignado || '';
        document.getElementById('cotHoraInicio').value = cot.hora_inicio || '';
        document.getElementById('cotHoraFin').value = cot.hora_fin || '';

        const personalAsignado = (cot.conductor_asignado || '').split(',').map(n => n.trim()).filter(Boolean);
        Array.from(document.getElementById('cotPersonal').options).forEach(o => {
            o.selected = personalAsignado.includes(o.value);
        });

        fotoBase64Actual = null;
        document.getElementById('cotFotoFile').value = '';
        if (cot.foto_url) {
            fotoUrlEnEdicion = cot.foto_url;
            document.getElementById('cotFotoPreview').src = cot.foto_url;
            document.getElementById('cotFotoNombre').textContent = 'Foto actual';
            document.getElementById('cotFotoPreviewWrap').classList.remove('hidden');
        } else {
            fotoUrlEnEdicion = null;
            document.getElementById('cotFotoPreviewWrap').classList.add('hidden');
        }

        openModal('modalCotizacion');
    }

    function previsualizarFoto(event) {
        const file = event.target.files[0];
        if (!file) { quitarFoto(); return; }
        if (file.size > 4 * 1024 * 1024) {
            mostrarToast('La imagen supera 4MB', 'error');
            event.target.value = '';
            return;
        }
        const reader = new FileReader();
        reader.onload = function (e) {
            fotoBase64Actual = { base64: e.target.result, nombre: file.name, mime: file.type };
            fotoUrlEnEdicion = null;
            document.getElementById('cotFotoPreview').src = e.target.result;
            document.getElementById('cotFotoNombre').textContent = file.name;
            document.getElementById('cotFotoPreviewWrap').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
    }

    function quitarFoto() {
        fotoBase64Actual = null;
        fotoUrlEnEdicion = null;
        document.getElementById('cotFotoFile').value = '';
        document.getElementById('cotFotoPreviewWrap').classList.add('hidden');
    }

    function hhmmAMinutos(t) {
        if (!t) return null;
        const partes = t.split(':').map(Number);
        if (partes.length < 2 || isNaN(partes[0]) || isNaN(partes[1])) return null;
        return partes[0] * 60 + partes[1];
    }

    function buscarConflictoVehiculo(vehiculo, fecha, horaInicio, horaFin, idExcluir) {
        if (!vehiculo || !fecha || !horaInicio || !horaFin) return null;
        const nuevoInicio = hhmmAMinutos(horaInicio);
        const nuevoFin = hhmmAMinutos(horaFin);
        if (nuevoInicio === null || nuevoFin === null || nuevoInicio >= nuevoFin) return null;

        for (const cot of cotizacionesCache) {
            if (idExcluir && cot.id_cotizacion === idExcluir) continue;
            if (cot.vehiculo_asignado !== vehiculo) continue;
            if (cot.fecha_programada !== fecha) continue;
            if (!ESTADOS_OCUPAN_VEHICULO.includes(cot.estado)) continue;

            const existInicio = hhmmAMinutos(cot.hora_inicio);
            const existFin = hhmmAMinutos(cot.hora_fin);
            if (existInicio === null || existFin === null) continue;

            if (nuevoInicio < existFin && existInicio < nuevoFin) {
                return cot;
            }
        }
        return null;
    }

    function renderizarCalendario() {
        const cont = document.getElementById('calendarioContenedor');
        const vacio = document.getElementById('calendarioVacio');
        const filtro = document.getElementById('filtroVehiculoProgramacion');
        if (!cont || !filtro) return;

        const vehiculosConServicio = [...new Set(cotizacionesCache.filter(c => c.vehiculo_asignado).map(c => c.vehiculo_asignado))].sort();
        const seleccionActual = filtro.value;
        filtro.innerHTML = '<option value="">Todos los vehículos</option>' +
            vehiculosConServicio.map(v => `<option value="${v}">${v}</option>`).join('');
        filtro.value = vehiculosConServicio.includes(seleccionActual) ? seleccionActual : '';

        let servicios = cotizacionesCache.filter(c => c.fecha_programada);
        if (filtro.value) servicios = servicios.filter(c => c.vehiculo_asignado === filtro.value);

        if (servicios.length === 0) {
            cont.innerHTML = '';
            vacio.classList.remove('hidden');
            return;
        }
        vacio.classList.add('hidden');

        const ESTILO_ESTADO = {
            'En Cotización': { pill: 'bg-amber-100 text-amber-700 border border-amber-200', barra: 'bg-amber-300', tentativo: true },
            'Programado':    { pill: 'bg-blue-50 text-blue-700 border border-blue-100',      barra: 'bg-blue-500',   tentativo: false },
            'En Ejecución':  { pill: 'bg-orange-50 text-orange-700 border border-orange-100', barra: 'bg-orange-500', tentativo: false },
            'Completado':    { pill: 'bg-emerald-50 text-emerald-700 border border-emerald-100', barra: 'bg-emerald-500', tentativo: false },
            'Rechazada':     { pill: 'bg-red-50 text-red-700 border border-red-100',         barra: 'bg-red-400',    tentativo: false }
        };
        const estiloDefault = { pill: 'bg-slate-100 text-slate-600 border border-slate-200', barra: 'bg-slate-300', tentativo: false };

        const porFecha = {};
        servicios.forEach(s => {
            if (!porFecha[s.fecha_programada]) porFecha[s.fecha_programada] = [];
            porFecha[s.fecha_programada].push(s);
        });
        const fechasOrdenadas = Object.keys(porFecha).sort();
        const hoyStr = new Date().toISOString().substring(0, 10);

        cont.innerHTML = fechasOrdenadas.map(fecha => {
            const items = porFecha[fecha].slice().sort((a, b) => (a.hora_inicio || '').localeCompare(b.hora_inicio || ''));
            const fechaLegible = new Date(fecha + 'T00:00:00').toLocaleDateString('es-PE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const esHoy = fecha === hoyStr;

            const filas = items.map(s => {
                const estilo = ESTILO_ESTADO[s.estado] || estiloDefault;
                const horario = (s.hora_inicio && s.hora_fin) ? `${s.hora_inicio} – ${s.hora_fin}` : (s.hora_inicio || s.hora_fin || 'Sin horario');
                const etiquetaTentativo = estilo.tentativo
                    ? `<span class="text-[10px] font-bold uppercase tracking-wide text-amber-600 bg-amber-50 border border-amber-200 px-1.5 py-0.5 rounded">Tentativo</span>`
                    : '';

                return `<div class="flex items-stretch gap-3 rounded-lg border border-slate-200 hover:shadow-sm transition overflow-hidden">
                    <div class="${estilo.barra} w-1.5 shrink-0"></div>
                    <div class="flex-1 flex flex-col sm:flex-row sm:items-center justify-between gap-2 py-2.5 pr-3">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="text-center shrink-0 w-20">
                                <p class="font-mono text-xs font-bold text-slate-700 leading-tight">${horario}</p>
                            </div>
                            <div class="min-w-0">
                                <p class="text-sm font-semibold text-slate-800 truncate">${s.cliente || ''} <span class="text-slate-400 font-normal">— ${s.id_cotizacion || ''}</span></p>
                                <p class="text-xs text-slate-500 truncate">${s.descripcion || ''}</p>
                                ${s.conductor_asignado ? `<p class="text-xs text-indigo-600 truncate"><i class="fa-solid fa-user-group mr-1"></i>${s.conductor_asignado}</p>` : ''}
                            </div>
                        </div>
                        <div class="flex items-center gap-2 flex-wrap shrink-0">
                            ${etiquetaTentativo}
                            <span class="text-xs font-mono text-slate-600 bg-slate-50 border border-slate-200 px-2 py-1 rounded-full"><i class="fa-solid fa-truck mr-1 text-slate-400"></i>${s.vehiculo_asignado || 'Sin vehículo'}</span>
                            <span class="${estilo.pill} text-xs px-2 py-1 rounded-full font-medium">${s.estado || ''}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');

            return `<div class="bg-white rounded-xl shadow-sm border ${esHoy ? 'border-indigo-300 ring-1 ring-indigo-100' : 'border-slate-200'} overflow-hidden">
                <div class="flex items-center justify-between px-4 py-2.5 border-b ${esHoy ? 'bg-indigo-600' : 'bg-slate-800'}">
                    <h3 class="text-sm font-bold text-white capitalize flex items-center gap-2">
                        <i class="fa-solid fa-calendar-day"></i>${fechaLegible}
                        ${esHoy ? '<span class="text-[10px] font-bold uppercase bg-white/20 px-2 py-0.5 rounded-full">Hoy</span>' : ''}
                    </h3>
                    <span class="text-xs text-white/80">${items.length} servicio${items.length === 1 ? '' : 's'}</span>
                </div>
                <div class="p-2.5 space-y-2">${filas}</div>
            </div>`;
        }).join('');
    }

    function autocompletarFactura() {
        const idCot = document.getElementById('facCot').value;
        const cot = cotizacionesCache.find(c => c.id_cotizacion === idCot);
        if (cot) {
            document.getElementById('facCliente').value = cot.cliente || '';
            document.getElementById('facMonto').value = cot.monto || '';
        }
    }

    function abrirModalBitacora() {
        const select = document.getElementById('bitCotizacion');
        const disponibles = cotizacionesCache.filter(c => c.estado === 'Programado' || c.estado === 'En Ejecución');
        select.innerHTML = '<option value="">Selecciona un servicio...</option>' +
            disponibles.map(c => `<option value="${c.id_cotizacion}">${c.id_cotizacion} — ${c.cliente} (${c.estado})</option>`).join('');

        document.getElementById('bitPlaca').value = '';
        document.getElementById('bitCliente').value = '';
        document.getElementById('bitPersonal').value = '';
        document.getElementById('bitEtapa').value = 'Salida Base MEJ';
        document.getElementById('bitKm').value = '';
        document.getElementById('bitObservaciones').value = '';

        if (disponibles.length === 0) {
            mostrarToast('No hay servicios en estado Programado o En Ejecución.', 'warning');
        }
        openModal('modalBitacora');
    }

    function autocompletarBitacora() {
        const idCot = document.getElementById('bitCotizacion').value;
        const cot = cotizacionesCache.find(c => c.id_cotizacion === idCot);
        if (cot) {
            document.getElementById('bitPlaca').value = cot.vehiculo_asignado || 'Sin vehículo asignado';
            document.getElementById('bitCliente').value = cot.cliente || '';
            document.getElementById('bitPersonal').value = cot.conductor_asignado || 'Sin personal asignado';

            const etapasOrden = ['Salida Base MEJ', 'Llegada a Cliente', 'Salida de Cliente', 'Retorno Base MEJ'];
            const registradas = bitacoraCache.filter(b => b.id_cotizacion === idCot).map(b => b.etapa);
            const siguiente = etapasOrden.find(e => !registradas.includes(e));
            if (siguiente) document.getElementById('bitEtapa').value = siguiente;
        } else {
            document.getElementById('bitPlaca').value = '';
            document.getElementById('bitCliente').value = '';
            document.getElementById('bitPersonal').value = '';
        }
    }

    async function guardarEtapaBitacora(event) {
        event.preventDefault();
        const btn = document.getElementById('btnGuardarBitacora');
        const btnTexto = document.getElementById('btnGuardarBitacoraTexto');
        const btnSpinner = document.getElementById('btnGuardarBitacoraSpinner');

        const idCotizacion = document.getElementById('bitCotizacion').value;
        if (!idCotizacion) { mostrarToast('Selecciona un servicio.', 'error'); return; }
        if (!sesionActual) { mostrarToast('Sesión expirada.', 'error'); return; }

        const data = {
            tipo: 'bitacora',
            id_cotizacion: idCotizacion,
            id_usuario: sesionActual.id_usuario,
            placa_vehiculo: document.getElementById('bitPlaca').value,
            etapa: document.getElementById('bitEtapa').value,
            km_lectura: document.getElementById('bitKm').value,
            observaciones: document.getElementById('bitObservaciones').value
        };

        btn.disabled = true;
        btnTexto.textContent = 'Guardando...';
        btnSpinner.classList.remove('hidden');

        try {
            const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(data) });
            const resp = await res.json();
            if (resp.result === 'error') throw new Error(resp.message || 'Error al guardar');

            closeModal('modalBitacora');
            cargarDatos();
            mostrarToast(`Etapa "${data.etapa}" registrada con éxito.`, 'success');
            event.target.reset();
        } catch (err) {
            mostrarToast('Error al registrar: ' + err.message, 'error');
        } finally {
            btn.disabled = false;
            btnTexto.textContent = 'Registrar Etapa';
            btnSpinner.classList.add('hidden');
        }
    }

    async function guardarRegistro(event, tipo) {
        event.preventDefault();
        let data = { tipo: tipo };
        const btn = document.getElementById('btnGuardar' + capitalize(tipo));
        const btnTexto = document.getElementById('btnGuardar' + capitalize(tipo) + 'Texto');
        const btnSpinner = document.getElementById('btnGuardar' + capitalize(tipo) + 'Spinner');

        if (tipo === 'cliente') {
            data.accion = document.getElementById('cliModo').value;
            data.id_cliente = document.getElementById('cliId').value;
            data.razon_social = document.getElementById('cliRazon').value.trim();
            data.ruc = document.getElementById('cliRuc').value.trim();
            data.contacto = document.getElementById('cliContacto').value.trim();
            data.correo = document.getElementById('cliCorreo').value.trim();
        } else if (tipo === 'cotizacion') {
            data.accion = document.getElementById('cotModo').value;
            data.id_cotizacion = document.getElementById('cotId').value || null;
            data.cliente = document.getElementById('cotCliente').value;
            data.descripcion = document.getElementById('cotDesc').value;
            data.peso_aprox = document.getElementById('cotPeso').value;
            data.tipo_material = document.getElementById('cotTipoMaterial').value;
            data.ubicacion = document.getElementById('cotUbicacion').value;
            data.tipo_pago = document.getElementById('cotTipoPago').value;
            data.monto = document.getElementById('cotMonto').value;
            data.estado = document.getElementById('cotEstado').value;
            data.fecha_programada = document.getElementById('cotFechaProgramada').value;
            data.vehiculo_asignado = document.getElementById('cotVehiculoAsignado').value;
            data.hora_inicio = document.getElementById('cotHoraInicio').value;
            data.hora_fin = document.getElementById('cotHoraFin').value;
            data.conductor_asignado = Array.from(document.getElementById('cotPersonal').selectedOptions).map(o => o.value).join(', ');

            if (fotoBase64Actual) {
                data.foto_base64 = fotoBase64Actual.base64;
                data.foto_name = fotoBase64Actual.nombre;
                data.foto_mime = fotoBase64Actual.mime;
            } else if (fotoUrlEnEdicion) {
                data.foto_url = fotoUrlEnEdicion;
            }

            if (ESTADOS_OCUPAN_VEHICULO.includes(data.estado)) {
                const conflicto = buscarConflictoVehiculo(
                    data.vehiculo_asignado, data.fecha_programada, data.hora_inicio, data.hora_fin,
                    data.accion === 'editar' ? data.id_cotizacion : null
                );
                if (conflicto) {
                    mostrarToast(`Conflicto de horario: el vehículo ${data.vehiculo_asignado} está ocupado por ${conflicto.id_cotizacion}.`, 'error');
                    return;
                }
            }
        } else if (tipo === 'vehiculo') {
            data.modelo = document.getElementById('vehModelo').value;
            data.placa = document.getElementById('vehPlaca').value;
            data.capacidad_m3 = document.getElementById('vehCapVol').value || '-';
            data.capacidad_tn = document.getElementById('vehCapTN').value;
            data.estado = document.getElementById('vehEstado').value;
        } else if (tipo === 'facturacion') {
            data.id_facturacion = document.getElementById('facId').value || null;
            data.cotizacion = document.getElementById('facCot').value;
            data.cliente = document.getElementById('facCliente').value;
            data.monto = document.getElementById('facMonto').value;
            data.fecha_pago = document.getElementById('facFechaPago').value;
            data.estado = document.getElementById('facEstado').value;
        }

        btn.disabled = true;
        btnTexto.textContent = "Guardando...";
        btnSpinner.classList.remove('hidden');

        try {
            const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(data) });
            const resp = await res.json();
            if (resp.result === 'error') throw new Error(resp.message || 'Error al guardar');

            closeModal('modal' + capitalize(tipo));
            cargarDatos();
            mostrarToast('Registro guardado con éxito', 'success');
            switchTab(tipo === 'cliente' ? 'clientes' : tipo === 'cotizacion' ? 'cotizaciones' : tipo === 'vehiculo' ? 'vehiculos' : 'facturacion');
            event.target.reset();
            quitarFoto();
        } catch (err) {
            mostrarToast('Error al guardar: ' + err.message, 'error');
        } finally {
            btn.disabled = false;
            btnTexto.textContent = tipo === 'facturacion' ? 'Guardar Factura' : ('Guardar ' + capitalize(tipo));
            btnSpinner.classList.add('hidden');
        }
    }

    function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
</script>
